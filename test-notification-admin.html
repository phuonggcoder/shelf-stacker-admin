<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notification Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .test-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Notification Admin System</h1>
        
        <div class="test-section">
            <h3>1. Test Events Loading</h3>
            <button class="btn btn-primary" onclick="testLoadEvents()">Load Events</button>
            <div id="eventsResult" class="mt-3"></div>
        </div>
        
        <div class="test-section">
            <h3>2. Test Template Creation</h3>
            <button class="btn btn-success" onclick="testCreateTemplate()">Create Template Modal</button>
            <div id="templateResult" class="mt-3"></div>
        </div>
        
        <div class="test-section">
            <h3>3. Test Console Logs</h3>
            <p>Mở Developer Tools (F12) và xem Console để kiểm tra logs</p>
        </div>
    </div>

    <!-- Template Modal -->
    <div class="modal fade" id="templateModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="templateModalTitle">Tạo Template mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="templateForm">
                        <div class="mb-3">
                            <label class="form-label">Tên template</label>
                            <input type="text" class="form-control" id="templateName" name="templateName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loại</label>
                            <select class="form-select" id="templateType" name="templateType" required>
                                <option value="">Chọn loại...</option>
                                <option value="user">User</option>
                                <option value="shipper">Shipper</option>
                                <option value="both">Both</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tiêu đề</label>
                            <input type="text" class="form-control" id="templateTitle" name="templateTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nội dung</label>
                            <textarea class="form-control" id="templateContent" name="templateContent" rows="4" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="testSaveTemplate()">Lưu Template</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="public/assets/js/notification-admin.js"></script>
    
    <script>
        function testLoadEvents() {
            console.log('Testing loadEvents...');
            if (window.notificationAdmin) {
                window.notificationAdmin.loadEvents();
                document.getElementById('eventsResult').innerHTML = '<div class="alert alert-success">Events loading test completed. Check console for details.</div>';
            } else {
                document.getElementById('eventsResult').innerHTML = '<div class="alert alert-danger">NotificationAdmin not initialized!</div>';
            }
        }
        
        function testCreateTemplate() {
            console.log('Testing createTemplate...');
            if (window.notificationAdmin) {
                window.notificationAdmin.createTemplate();
                document.getElementById('templateResult').innerHTML = '<div class="alert alert-success">Template creation test completed. Check console for details.</div>';
            } else {
                document.getElementById('templateResult').innerHTML = '<div class="alert alert-danger">NotificationAdmin not initialized!</div>';
            }
        }
        
        function testSaveTemplate() {
            console.log('Testing saveTemplate...');
            if (window.notificationAdmin) {
                window.notificationAdmin.saveTemplate();
            } else {
                alert('NotificationAdmin not initialized!');
            }
        }
        
        // Test initialization
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Test page loaded');
            setTimeout(() => {
                if (window.notificationAdmin) {
                    console.log('✅ NotificationAdmin is available');
                } else {
                    console.log('❌ NotificationAdmin is NOT available');
                }
            }, 1000);
        });
    </script>
</body>
</html>
