<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notification Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Notification Admin</h1>
        <p>Nếu bạn thấy trang này, server đang hoạt động.</p>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Kiểm tra JavaScript</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testJS()">Test JavaScript</button>
                        <div id="jsResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Kiểm tra API</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="testAPI()">Test API</button>
                        <div id="apiResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/notification-admin" class="btn btn-info">Mở Notification Admin</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function testJS() {
            document.getElementById('jsResult').innerHTML = '<div class="alert alert-success">JavaScript hoạt động bình thường!</div>';
        }
        
        async function testAPI() {
            try {
                const response = await fetch('/api/notifications/stats');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('apiResult').innerHTML = '<div class="alert alert-success">API hoạt động! Dữ liệu: ' + JSON.stringify(data) + '</div>';
                } else {
                    document.getElementById('apiResult').innerHTML = '<div class="alert alert-warning">API trả về lỗi: ' + response.status + '</div>';
                }
            } catch (error) {
                document.getElementById('apiResult').innerHTML = '<div class="alert alert-danger">Lỗi API: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
