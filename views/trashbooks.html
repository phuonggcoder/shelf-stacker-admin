  <style>
    .restore-btn {
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 8px 14px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .restore-btn:hover {
      background: #218838;
    }
    .product-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fff6f6;
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }
    .product-images img {
      max-width: 80px;
      margin: 2px;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    .info {
      flex: 1;
    }
    .desc-wrap {
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .toggle-desc {
      color: #0ea5e9;
      cursor: pointer;
      margin-left: 6px;
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
