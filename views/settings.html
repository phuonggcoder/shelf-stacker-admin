<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt - Shelf Stacker Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/assets/css/admin-main.css" />
    <link rel="stylesheet" href="/assets/css/admin-ui-components.css" />
    <script src="/assets/js/loading-state-helper.js"></script>
    <script src="/assets/js/includes.js"></script>
  </head>
  <body>
    <!-- Sidebar -->
    <div data-include="/partials/sidebar.html"></div>

    <main class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="breadcrumb">
            <i class="fas fa-home"></i><span>Cài đặt</span>
          </div>
        </div>
        <div class="header-right">
          <div class="user-menu">
            <div class="user-avatar-small" id="userAvatarSmall">
              <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-menu-dropdown">
              <a href="/settings" class="dropdown-item"
                ><i class="fas fa-cog"></i><span>Cài đặt</span></a
              >
              <a href="#" class="dropdown-item" id="logoutMenuItem"
                ><i class="fas fa-sign-out-alt"></i><span>Đăng xuất</span></a
              >
            </div>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1 class="page-title">Cài đặt hệ thống</h1>
          <p class="page-description">Quản lý cấu hình và tùy chọn hệ thống</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem">
          <!-- General Settings -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-cog me-2"></i>Cài đặt chung
              </h3>
            </div>
            <div style="padding: 1rem 0">
              <div class="form-group">
                <label class="form-label">Tên hệ thống</label>
                <input
                  type="text"
                  id="systemName"
                  class="form-input"
                  value="Shelf Stacker Admin"
                  placeholder="Tên hệ thống"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Email liên hệ</label>
                <input
                  type="email"
                  id="contactEmail"
                  class="form-input"
                  value="admin@shelfstacker.com"
                  placeholder="Email liên hệ"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input
                  type="tel"
                  id="contactPhone"
                  class="form-input"
                  value=""
                  placeholder="Số điện thoại"
                />
              </div>
              <button
                class="btn btn-primary"
                id="saveGeneralBtn"
                onclick="saveGeneralSettings()"
              >
                <i class="fas fa-save"></i> Lưu cài đặt
              </button>
            </div>
          </div>

          <!-- Security Settings -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-shield-alt me-2"></i>Bảo mật
              </h3>
            </div>
            <div style="padding: 1rem 0">
              <div class="form-group">
                <label class="form-label"
                  >Thời gian hết hạn session (phút)</label
                >
                <input
                  type="number"
                  id="sessionTimeout"
                  class="form-input"
                  value="30"
                  min="5"
                  max="480"
                />
              </div>
              <div class="form-group">
                <label class="form-label">
                  <input
                    type="checkbox"
                    id="require2FA"
                    style="margin-right: 0.5rem"
                  />
                  Yêu cầu xác thực 2 yếu tố
                </label>
              </div>
              <div class="form-group">
                <label class="form-label">
                  <input
                    type="checkbox"
                    id="enableLogging"
                    checked
                    style="margin-right: 0.5rem"
                  />
                  Bật ghi log hoạt động
                </label>
              </div>
              <button
                class="btn btn-primary"
                id="saveSecurityBtn"
                onclick="saveSecuritySettings()"
              >
                <i class="fas fa-save"></i> Lưu cài đặt
              </button>
            </div>
          </div>

          <!-- Notification Settings -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-bell me-2"></i>Thông báo
              </h3>
            </div>
            <div style="padding: 1rem 0">
              <div class="form-group">
                <label class="form-label">
                  <input
                    type="checkbox"
                    id="emailNotifications"
                    checked
                    style="margin-right: 0.5rem"
                  />
                  Gửi thông báo qua Email
                </label>
              </div>
              <div class="form-group">
                <label class="form-label">
                  <input
                    type="checkbox"
                    id="pushNotifications"
                    checked
                    style="margin-right: 0.5rem"
                  />
                  Gửi thông báo Push
                </label>
              </div>
              <div class="form-group">
                <label class="form-label">Email nhận thông báo</label>
                <input
                  type="email"
                  id="notificationEmail"
                  class="form-input"
                  value=""
                  placeholder="admin@example.com"
                />
              </div>
              <button
                class="btn btn-primary"
                id="saveNotificationBtn"
                onclick="saveNotificationSettings()"
              >
                <i class="fas fa-save"></i> Lưu cài đặt
              </button>
            </div>
          </div>

          <!-- System Info -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-info-circle me-2"></i>Thông tin hệ thống
              </h3>
            </div>
            <div style="padding: 1rem 0">
              <div style="margin-bottom: 1rem">
                <strong>Phiên bản:</strong>
                <span id="systemVersion">1.0.0</span>
              </div>
              <div style="margin-bottom: 1rem">
                <strong>API Endpoint:</strong>
                <code
                  id="apiEndpoint"
                  style="
                    background: #f3f4f6;
                    padding: 0.25rem 0.5rem;
                    border-radius: 4px;
                  "
                  >https://server-shelf-stacker-w1ds.onrender.com</code
                >
              </div>
              <div style="margin-bottom: 1rem">
                <strong>Trạng thái:</strong>
                <span class="badge badge-success" id="systemStatus"
                  >Hoạt động</span
                >
              </div>
              <button
                class="btn btn-secondary"
                id="checkSystemBtn"
                onclick="checkSystemStatus()"
              >
                <i class="fas fa-sync"></i> Kiểm tra hệ thống
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p>Đang tải...</p>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="/AdminServices.js"></script>
    <script src="/assets/js/retry-helper.js"></script>
    <script src="/assets/js/global-error-handler.js"></script>
    <script src="/assets/js/admin-layout.js"></script>
    <script src="/assets/js/admin-ui-components.js"></script>
    <script src="/assets/js/api-response-helpers.js"></script>
    <script src="/assets/js/admin-settings.js"></script>
  </body>
</html>
