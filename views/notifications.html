<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Thông báo - Shelf Stacker Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/assets/css/admin-main.css" />
    <link rel="stylesheet" href="/assets/css/admin-ui-components.css" />
    <script src="/assets/js/loading-state-helper.js"></script>
    <script src="/assets/js/includes.js"></script>
  </head>
  <body>
    <!-- Sidebar -->
    <div data-include="/partials/sidebar.html"></div>

    <main class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="breadcrumb">
            <i class="fas fa-home"></i><span>Thông báo</span>
          </div>
        </div>
        <div class="header-right">
          <div class="user-menu">
            <div class="user-avatar-small" id="userAvatarSmall">
              <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-menu-dropdown">
              <a href="/settings" class="dropdown-item"
                ><i class="fas fa-cog"></i><span>Cài đặt</span></a
              >
              <a href="#" class="dropdown-item" id="logoutMenuItem"
                ><i class="fas fa-sign-out-alt"></i><span>Đăng xuất</span></a
              >
            </div>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1 class="page-title">Quản lý Thông báo</h1>
          <p class="page-description">
            Quản lý templates, gửi thông báo và lịch gửi
          </p>
        </div>

        <!-- Tabs -->
        <div class="card" style="margin-bottom: 1.5rem">
          <div
            style="display: flex; gap: 0.5rem; border-bottom: 1px solid #e5e7eb"
          >
            <button
              class="tab-btn active"
              data-tab="templates"
              style="
                padding: 1rem;
                background: none;
                border: none;
                border-bottom: 2px solid #6366f1;
                cursor: pointer;
                font-weight: 500;
              "
            >
              <i class="fas fa-file-alt"></i> Templates
            </button>
            <button
              class="tab-btn"
              data-tab="scheduled"
              style="
                padding: 1rem;
                background: none;
                border: none;
                cursor: pointer;
                color: #6b7280;
              "
            >
              <i class="fas fa-clock"></i> Đã lên lịch
            </button>
            <button
              class="tab-btn"
              data-tab="history"
              style="
                padding: 1rem;
                background: none;
                border: none;
                cursor: pointer;
                color: #6b7280;
              "
            >
              <i class="fas fa-history"></i> Lịch sử
            </button>
            <button
              class="tab-btn"
              data-tab="send"
              style="
                padding: 1rem;
                background: none;
                border: none;
                cursor: pointer;
                color: #6b7280;
              "
            >
              <i class="fas fa-paper-plane"></i> Gửi ngay
            </button>
          </div>
        </div>

        <!-- Templates Tab -->
        <div id="templatesTab" class="tab-content">
          <div class="card" style="margin-bottom: 1.5rem">
            <div
              style="
                display: flex;
                gap: 1rem;
                align-items: center;
                flex-wrap: wrap;
              "
            >
              <input
                type="text"
                id="searchInput"
                class="form-input"
                placeholder="Tìm kiếm template..."
                style="flex: 1; min-width: 250px"
              />
              <select id="typeFilter" class="form-select" style="width: 150px">
                <option value="">Tất cả loại</option>
                <option value="email">Email</option>
                <option value="push">Push</option>
                <option value="sms">SMS</option>
              </select>
              <button class="btn btn-primary" id="addTemplateBtn">
                <i class="fas fa-plus"></i> Tạo template
              </button>
              <button class="btn btn-secondary" id="refreshBtn">
                <i class="fas fa-sync"></i>
              </button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Danh sách templates</h3>
              <span
                style="color: #6b7280; font-size: 0.9rem"
                id="templatesCount"
                >0 templates</span
              >
            </div>
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Tên</th>
                    <th>Loại</th>
                    <th>Event</th>
                    <th>Tiêu đề</th>
                    <th>Trạng thái</th>
                    <th style="width: 200px">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="templatesTableBody">
                  <tr>
                    <td colspan="6" style="text-align: center; padding: 3rem">
                      <i class="fas fa-spinner fa-spin"></i>
                      <p style="margin-top: 1rem">Đang tải...</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Scheduled Tab -->
        <div id="scheduledTab" class="tab-content" style="display: none">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Thông báo đã lên lịch</h3>
            </div>
            <div id="scheduledList" style="padding: 1.5rem">
              <div style="text-align: center; padding: 3rem">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top: 1rem; color: #6b7280">Đang tải...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- History Tab -->
        <div id="historyTab" class="tab-content" style="display: none">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Lịch sử gửi thông báo</h3>
            </div>
            <div id="historyList" style="padding: 1.5rem">
              <div style="text-align: center; padding: 3rem">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top: 1rem; color: #6b7280">Đang tải...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Send Tab -->
        <div id="sendTab" class="tab-content" style="display: none">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Gửi thông báo ngay</h3>
            </div>
            <div style="padding: 1.5rem">
              <form id="sendNotificationForm">
                <div class="form-group">
                  <label class="form-label">Tiêu đề</label>
                  <input
                    type="text"
                    id="sendTitle"
                    class="form-input"
                    required
                  />
                </div>
                <div class="form-group">
                  <label class="form-label">Nội dung</label>
                  <textarea
                    id="sendMessage"
                    class="form-textarea"
                    rows="5"
                    required
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label"
                    >Người nhận (User IDs, cách nhau bởi dấu phẩy)</label
                  >
                  <input
                    type="text"
                    id="sendRecipients"
                    class="form-input"
                    placeholder="user1,user2,user3"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-paper-plane"></i> Gửi ngay
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p>Đang tải...</p>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="/AdminServices.js"></script>
    <script src="/assets/js/retry-helper.js"></script>
    <script src="/assets/js/global-error-handler.js"></script>
    <script src="/assets/js/admin-layout.js"></script>
    <script src="/assets/js/admin-ui-components.js"></script>
    <script src="/assets/js/admin-notifications.js"></script>
  </body>
</html>
