<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý truyện tranh</title>
  <link rel="stylesheet" href="../public/assets/css/DSsanpham.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.ckeditor.com/ckeditor5/41.2.1/classic/ckeditor.js"></script>
  <style>
    .dialog-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }
    .dialog-overlay.active {
      display: flex;
    }
    .dialog-box {
      background: #fff; 
      border-radius: 8px;
      padding: 32px 24px 16px 24px;
      min-width: 340px;
      max-width: 95vw;
      box-shadow: 0 4px 32px rgba(0,0,0,0.15);
      position: relative;
      animation: popup 0.2s;
    }
    @keyframes popup {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .dialog-box h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
      text-align: center;
    }
    .dialog-box .close-btn {
      position: absolute;
      top: 12px; right: 16px;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #888;
    }
    .dialog-box form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dialog-box input, .dialog-box select, .dialog-box textarea {
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .dialog-box textarea {
      min-height: 80px;
      resize: vertical;
    }
    .dialog-box button[type="submit"] {
      margin-top: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .dialog-box button[type="submit"]:hover {
      background: #0056b3;
    }

    /* Thêm vào cuối <style> trong <head> */
    .pagination-btn {
      background: #fff;
      color: #007bff;
      border: 1px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 6px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .pagination-btn:disabled {
      background: #eee;
      color: #aaa;
      border: 1px solid #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">SleekAdmin</div>
    <div class="user">
      <input type="text" placeholder="Enter keywords..." id="searchInput" />
      <img src="https://i.pravatar.cc/40" alt="User" class="avatar" />
    </div>
  </header>

  <aside class="sidebar">
    <div class="profile">
      <img src="https://i.pravatar.cc/100" alt="User Profile" />
      <h3>Jonathan Clarke</h3>
      <p>UI/UX Designer</p>
    </div>
    <nav>
      <ul>
        <li><a href="home.html">TRANG CHỦ</a></li>
        <li><a href="quanlydanhmuc.html">QUẢN LÝ DANH MỤC</a></li>
        <li><a href="danhgiasanpham.html">DANH SÁCH TRUYỆN TRANH</a></li>
        <li><a href="quanlynguoidung.html">QUẢN LÝ NGƯỜI DÙNG</a></li>
        <li><a href="danhmucdonhang.html">QUẢN LÝ ĐƠN HÀNG</a></li>
        <li><a href="danhgia.html">ĐÁNH GIÁ</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <section class="management-section">
      <h1 class="title">Danh sách truyện tranh</h1>
      <div class="search-filter" style="display: flex; gap: 6px; align-items: center; margin-bottom: 16px;">
        <input type="text" class="input" placeholder="Tìm truyện..." id="searchBox"
          style="padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; outline: none; flex: 1;" />
        <button id="btn-search" type="button"
          style="display: flex; align-items: center; gap: 6px; background: #007bff; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; font-size: 16px; cursor: pointer; transition: background 0.2s;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#fff" stroke-width="2"/><path stroke="#fff" stroke-width="2" stroke-linecap="round" d="M20 20l-3-3"/></svg>
          Tìm kiếm
        </button>
        <select id="sort-title" style="padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
          <option value="">Sắp xếp theo tên</option>
          <option value="asc">Tên A → Z</option>
          <option value="desc">Tên Z → A</option>
        </select>
        <button class="btn btn-add" id="addBookBtn" style="background: #28a745; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; font-size: 16px; cursor: pointer;">+ Thêm truyện</button>
      </div>
      <div class="product-grid" id="productGrid">
        <!-- Các sản phẩm sẽ được render ở đây từ API -->
      </div>
    </section>
  </main>

  <!-- Dialog Thêm/Sửa truyện -->
  <div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-box">
      <button class="close-btn" id="closeDialogBtn" title="Đóng">&times;</button>
      <h2 id="dialogTitle">Thêm truyện mới</h2>
      <form id="addBookForm">
        <input type="text" id="bookName" placeholder="Tên truyện" required />
        <input type="text" id="bookAuthor" placeholder="Tác giả" required />
        <input type="number" id="bookPrice" placeholder="Giá tiền" min="0" step="0.01" required />
        <!-- CKEditor 5 cho mô tả -->
        <textarea id="bookDesc" placeholder="Mô tả"></textarea>
        <input type="text" id="bookImage" placeholder="Link ảnh" required />
        <input type="number" id="bookStock" placeholder="Số lượng" min="0" required />
        <input type="date" id="bookPubDate" placeholder="Ngày xuất bản" required />
        <input type="text" id="bookPublisher" placeholder="Nhà xuất bản" required />
        <input type="text" id="bookLanguage" placeholder="Ngôn ngữ" required />
        <input type="text" id="bookCategory" placeholder="Danh mục (nhập id, cách nhau dấu phẩy)" required />
        <button type="submit">Lưu</button>
      </form>
    </div>
  </div>

  <script>
  const apiURL = 'https://server-shelf-stacker.onrender.com/api/books/all';
  const apiPostURL = 'https://server-shelf-stacker.onrender.com/api/books';

  const productGrid = document.getElementById('productGrid');
  const searchBox = document.getElementById('searchBox');
  const addBookBtn = document.getElementById('addBookBtn');
  const dialogOverlay = document.getElementById('dialogOverlay');
  const closeDialogBtn = document.getElementById('closeDialogBtn');
  const addBookForm = document.getElementById('addBookForm');
  const dialogTitle = document.getElementById('dialogTitle');

  // CKEditor 5 setup
  let bookDescEditor = null;
  let ckeditorPromise = null;
  function initCKEditorIfNeeded() {
    if (!ckeditorPromise) {
      ckeditorPromise = ClassicEditor.create(document.querySelector('#bookDesc'))
        .then(editor => {
          bookDescEditor = editor;
          return editor;
        })
        .catch(error => {
          console.error(error);
        });
    }
    return ckeditorPromise;
  }
  // Khởi tạo CKEditor khi trang load
  initCKEditorIfNeeded();

  // Hiện dialog khi bấm Thêm truyện
  addBookBtn.addEventListener('click', () => {
    dialogTitle.textContent = 'Thêm truyện mới';
    addBookForm.reset();
    addBookForm.removeAttribute('data-edit-id');
    dialogOverlay.classList.add('active');
    setTimeout(() => {
      initCKEditorIfNeeded().then(() => {
        if (bookDescEditor) bookDescEditor.setData('');
      });
    }, 0);
  });
  // Đóng dialog
  closeDialogBtn.addEventListener('click', () => {
    dialogOverlay.classList.remove('active');
    addBookForm.reset();
    addBookForm.removeAttribute('data-edit-id');
    if (bookDescEditor) bookDescEditor.setData('');
  });
  // Đóng dialog khi bấm ra ngoài
  dialogOverlay.addEventListener('click', (e) => {
    if (e.target === dialogOverlay) {
      dialogOverlay.classList.remove('active');
      addBookForm.reset();
      addBookForm.removeAttribute('data-edit-id');
      if (bookDescEditor) bookDescEditor.setData('');
    }
  });

  // Hàm render danh sách sản phẩm
  function renderProducts(products) {
    productGrid.innerHTML = '';
    if(products.length === 0){
      productGrid.innerHTML = '<p>Không tìm thấy truyện phù hợp.</p>';
      return;
    }
    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';

      card.innerHTML = `
        <img src="${product.cover_image || product.image || ''}" alt="${product.title || product.name}" />
        <div class="info">
          <h3>${product.title || product.name}</h3>
          <p><b>Tác giả:</b> ${product.author || ''}</p>
          <p><b>Giá:</b> ${product.price ? product.price + '₫' : ''}</p>
          <p>${product.description || ''}</p>
          <span>
            <b>Danh mục:</b> ${(product.categories && product.categories.length > 0) ? product.categories.map(c=>c.name || c).join(', ') : ''}
          </span>
          <br>
          <span>
            <b>Số lượng:</b> ${product.stock || ''}
          </span>
          <br>
          <span>
            <b>Ngày xuất bản:</b> ${product.publication_date ? new Date(product.publication_date).toLocaleDateString() : ''}
          </span>
          <br>
          <span>
            <b>Nhà xuất bản:</b> ${product.publisher || ''}
          </span>
          <br>
          <span>
            <b>Ngôn ngữ:</b> ${product.language || ''}
          </span>
        </div>
        <div class="actions">
          <button class="edit-btn" data-id="${product._id}"><i class="fas fa-pen"></i></button>
          <button class="delete-btn" data-id="${product._id}"><i class="fas fa-trash"></i></button>
        </div>
      `;
      productGrid.appendChild(card);
    });

    // Gán sự kiện XÓA
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.getAttribute('data-id');
        if (confirm('Bạn có chắc muốn xóa truyện này?')) {
          try {
            const res = await fetch(`https://server-shelf-stacker.onrender.com/api/books/${id}`, {
              method: 'DELETE'
            });
            if (!res.ok) {
              const errText = await res.text();
              alert('Xóa thất bại!\n' + errText);
              return;
            }
            alert('Đã xóa truyện!');
            products = await fetchProducts();
            renderProductsWithPagination(products, currentPage);
          } catch (err) {
            alert('Có lỗi khi xóa truyện!\n' + err.message);
          }
        }
      });
    });

    // Gán sự kiện SỬA
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const id = this.getAttribute('data-id');
        const book = products.find(p => p._id === id);
        if (!book) return;
        dialogTitle.textContent = 'Cập nhật truyện';
        addBookForm.reset();
        document.getElementById('bookName').value = book.title || '';
        document.getElementById('bookAuthor').value = book.author || '';
        document.getElementById('bookPrice').value = book.price || '';
        setTimeout(() => {
          initCKEditorIfNeeded().then(() => {
            if (bookDescEditor) bookDescEditor.setData(book.description || '');
          });
        }, 0);
        document.getElementById('bookImage').value = book.cover_image || '';
        document.getElementById('bookStock').value = book.stock || '';
        document.getElementById('bookPubDate').value = book.publication_date ? book.publication_date.substr(0,10) : '';
        document.getElementById('bookPublisher').value = book.publisher || '';
        document.getElementById('bookLanguage').value = book.language || '';
        document.getElementById('bookCategory').value = (book.categories && book.categories.length > 0) ? book.categories.map(c=>c._id || c).join(',') : '';
        addBookForm.setAttribute('data-edit-id', id);
        dialogOverlay.classList.add('active');
      });
    });
  }

  // Hàm lấy dữ liệu từ API
  async function fetchProducts() {
    try {
      const response = await fetch(apiURL);
      if (!response.ok) throw new Error('Lỗi kết nối API');
      const data = await response.json();
      return data;
    } catch (error) {
      console.error(error);
      productGrid.innerHTML = '<p>Không thể tải danh sách truyện tranh.</p>';
      return [];
    }
  }

  // Hàm lọc sản phẩm theo từ khóa (tìm trong tên, mô tả, tác giả)
  function filterProducts(products, keyword) {
    const lower = keyword.toLowerCase();
    return products.filter(p =>
      (p.title || '').toLowerCase().includes(lower) ||
      (p.author || '').toLowerCase().includes(lower) ||
      (p.description || '').toLowerCase().includes(lower)
    );
  }

  // Hàm sắp xếp
  function sortByTitle(arr, order) {
    if (!order) return arr;
    return [...arr].sort((a, b) => {
      const tA = (a.title || a.name || '').toLowerCase();
      const tB = (b.title || b.name || '').toLowerCase();
      if (tA < tB) return order === 'asc' ? -1 : 1;
      if (tA > tB) return order === 'asc' ? 1 : -1;
      return 0;
    });
  }

  // PHÂN TRANG
  let products = [];
  let currentPage = 1;
  const pageSize = 6;

  // Thêm HTML cho phân trang vào sau productGrid
  const pagination = document.createElement('div');
  pagination.id = 'pagination';
  pagination.style = 'display:flex;justify-content:center;gap:10px;margin:20px 0;';
  document.getElementById('productGrid').parentNode.appendChild(pagination);

  function renderProductsWithPagination(productsArr, page = 1) {
    const totalPages = Math.ceil(productsArr.length / pageSize);
    if (page > totalPages && totalPages > 0) page = totalPages;
    if (page < 1) page = 1;
    currentPage = page;

    // Lấy sản phẩm cho trang hiện tại
    const start = (page - 1) * pageSize;
    const end = start + pageSize;
    const pageProducts = productsArr.slice(start, end);

    renderProducts(pageProducts);

    // Render nút phân trang
    pagination.innerHTML = '';
    if (totalPages > 1) {
      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      prevBtn.className = 'pagination-btn';
      prevBtn.disabled = page === 1;
      prevBtn.style.background = "#fff";
      prevBtn.style.border = "1px solid #007bff";
      prevBtn.style.borderRadius = "50%";
      prevBtn.style.width = "40px";
      prevBtn.style.height = "40px";
      prevBtn.style.display = "flex";
      prevBtn.style.alignItems = "center";
      prevBtn.style.justifyContent = "center";
      prevBtn.style.margin = "0 6px";
      prevBtn.onclick = () => renderFilteredAndSorted(page - 1);

      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      nextBtn.className = 'pagination-btn';
      nextBtn.disabled = page === totalPages;
      nextBtn.style.background = "#fff";
      nextBtn.style.border = "1px solid #007bff";
      nextBtn.style.borderRadius = "50%";
      nextBtn.style.width = "40px";
      nextBtn.style.height = "40px";
      nextBtn.style.display = "flex";
      nextBtn.style.alignItems = "center";
      nextBtn.style.justifyContent = "center";
      nextBtn.style.margin = "0 6px";
      nextBtn.onclick = () => renderFilteredAndSorted(page + 1);

      const pageInfo = document.createElement('span');
      pageInfo.textContent = `Trang ${page} / ${totalPages}`;
      pageInfo.style = 'padding: 0 10px; font-weight:bold; font-size:16px; color:#007bff; display:flex; align-items:center;';

      pagination.appendChild(prevBtn);
      pagination.appendChild(pageInfo);
      pagination.appendChild(nextBtn);
    }
  }

  // Hàm kết hợp lọc, sắp xếp và phân trang
  function renderFilteredAndSorted(page = 1) {
    const keyword = searchBox.value.trim();
    const sortOrder = document.getElementById('sort-title').value;
    let filtered = filterProducts(products, keyword);
    filtered = sortByTitle(filtered, sortOrder);
    renderProductsWithPagination(filtered, page);
  }

  // Nút tìm kiếm
  document.getElementById('btn-search').addEventListener('click', () => renderFilteredAndSorted(1));

  // Vẫn giữ chức năng lọc realtime khi gõ vào ô "Tìm truyện"
  searchBox.addEventListener('input', () => renderFilteredAndSorted(1));
  document.getElementById('sort-title').addEventListener('change', () => renderFilteredAndSorted(1));

  // Main chạy khi load trang
  document.addEventListener('DOMContentLoaded', async () => {
    products = await fetchProducts();
    renderFilteredAndSorted(1);
  });
  </script>
</body>
</html>
