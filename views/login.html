<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trang quản trị</title>
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>
<body>
  <h1>
    <img src="https://cdn-icons-png.flaticon.com/512/753/753345.png" alt="icon" />
    Quản trị viên
  </h1>

  <div class="container">
    <div class="login">
      <h2>Đăng nhập</h2>
      <p>
        Anim pariatur cliche reprehenderit, enim eiusmod cuộc sống thường lưu cáo buộc terry Richardson quảng cáo mục. 3 sỏi mặt trắng officia aute, non cupidatat văn trượt dolor bữa nửa buổi.
      </p>
      <a href="register.html">Chưa có tài khoản? Đăng ký </a>
    </div>
    <div class="register">
      <h2>Đăng Nhập</h2>
      <p>Tạo tài khoản mới</p>
      <input type="text" id="username" placeholder="Tên người dùng">
      <input type="password" id="password" placeholder="Mật khẩu">
      <button id="loginBtn">Đăng nhập</button>
      <p id="errorMsg"></p>
    </div>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async function () {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.textContent = '';

      if (!username || !password) {
        errorMsg.textContent = 'Vui lòng nhập đầy đủ tên người dùng và mật khẩu.';
        return;
      }

      try {
        const response = await fetch('https://server-shelf-stacker.onrender.com/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = 'home.html';
        } else {
          errorMsg.textContent = data.message || 'Tên người dùng hoặc mật khẩu không đúng.';
        }
      } catch (error) {
        errorMsg.textContent = 'Không thể kết nối đến máy chủ. Vui lòng thử lại.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
