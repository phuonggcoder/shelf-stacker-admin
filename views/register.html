<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Đăng Ký</title>
  <link rel="stylesheet" href="/assets/css/regiser.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <h2 class="logo"><i class="fas fa-rocket"></i> Quản trị viên</h2>
    <div class="box">
      <div class="left">
        <h3>Đăng nhập</h3>
        <p>Anim pariatur cliche reprehenderit, enim eiusmod cuộc sống thường lưu cáo buộc terry Richardson quảng cáo mục. 3 sỏi mặt trắng officia aute, non cupidatat văn trượt dolor bữa nửa buổi.</p>
        <button>Đăng nhập tại đây</button>
      </div>
      <div class="right">
        <h3>Đăng ký</h3>
        <p>Tạo tài khoản mới</p>
        <form>
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Tên người dùng">
          </div>
          <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="johndoe@gmail.com">
          </div>
          <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="text" placeholder="555-098-444">
          </div>
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" placeholder="Mật khẩu">
          </div>
          <button class="submit-btn">Đăng ký</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
