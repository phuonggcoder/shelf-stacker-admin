<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Voucher Detail</title>
  <link rel="stylesheet" href="/assets/css/vouchers-admin.css">
    <script src="/assets/js/loading-state-helper.js"></script>
</head>
<body>
  <div class="container">
    <h1>Voucher Detail</h1>
    <div id="voucher-root"></div>
    <div id="used-by-section">
      <h2>Usage / Reports</h2>
      <div class="usage-controls">
        <label>From <input id="usage-from" type="date"></label>
        <label>To <input id="usage-to" type="date"></label>
        <button id="btn-filter-usages">Filter</button>
        <button id="export-csv">Export CSV</button>
      </div>
      <table id="used-by-table">
        <thead><tr><th>User</th><th>Order</th><th>Date</th><th>Amount</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/voucher-detail.js"></script>
</body>
</html>
