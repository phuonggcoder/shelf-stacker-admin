<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản Lý Người Dùng</title>
  <link rel="stylesheet" href="../public/assets/css/QuanLyKH.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header class="header">
    <div class="logo">SleekAdmin</div>
    <div class="user">
      <input type="text" placeholder="Enter keywords..." />
      <img src="https://i.pravatar.cc/40" alt="User" class="avatar" />
    </div>
  </header>

  <aside class="sidebar">
    <div class="profile">
      <img src="https://i.pravatar.cc/100" alt="User Profile" />
      <h3>Jonathan Clarke</h3>
      <p>UI/UX Designer</p>
    </div>
    <nav>
        <ul>
                <li><a href="home.html">TRANG CHỦ</a></li>
                <li><a href="quanlydanhmuc.html">QUẢN LÝ DANH MỤC</a></li>
                <li><a href="danhgiasanpham.html">DANH SÁCH TRUYỆN TRANH</a></li>
                <li><a href="quanlynguoidung.html">QUẢN LÝ NGƯỜI DÙNG</a></li>
                <li><a href="danhmucdonhang.html">QUẢN LÝ ĐƠN HÀNG</a></li>
                <li><a href="danhgia.html">ĐÁNH GIÁ</a></li>
            </ul>
    </nav>
  </aside>

  <main class="main">
    <section class="management-section">
      <h1 class="title">Quản Lý Người Dùng</h1>
      <div class="search-filter">
        <input type="text" class="input" placeholder="Tìm kiếm theo tên, email, số điện thoại..." />
        <select class="select">
          <option value="">Tất cả trạng thái</option>
          <option value="active">Đang hoạt động</option>
          <option value="locked">Đã khóa</option>
        </select>
        <button class="btn btn-add">+ Thêm người dùng</button>
      </div>
      <div class="table-wrapper">
        <table class="user-table">
          <thead>
            <tr>
              <th>Họ tên</th>
              <th>Email</th>
              <th>Số điện thoại</th>
              <th>Trạng thái</th>
              <th>Ngày tạo</th>
              <th class="actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="6" style="text-align:center;">Đang tải...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    async function fetchUsers() {
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Đang tải...</td></tr>';
      try {
        const res = await fetch('https://server-shelf-stacker.onrender.com/auth/users');
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          tbody.innerHTML = '';
          data.forEach((user, idx) => {
            const address = user.address
              ? `
                <div><b>Địa chỉ:</b> ${user.address.street || ''}, ${user.address.ward || ''}, ${user.address.district || ''}, ${user.address.city || ''}, ${user.address.country || ''}</div>
              `
              : '<div><b>Địa chỉ:</b> Không có</div>';
            tbody.innerHTML += `
              <tr>
                <td>${user.full_name || user.username || ''}</td>
                <td>${user.email || ''}</td>
                <td>${user.phone_number || ''}</td>
                <td>
                  <span style="color: ${user.isActive ? '#' : '#FF0000'};">
                    ${user.isActive ? 'Đang hoạt động' : 'Đã khóa'}
                  </span>
                </td>
                <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('vi-VN') : ''}</td>
                <td class="actions">
                  <button class="btn btn-detail" data-idx="${idx}">Chi tiết</button>
                  <button class="btn btn-edit" data-id="${user._id}" data-idx="${idx}">Sửa</button>
                  <button class="btn btn-lock-toggle" data-id="${user._id}" data-active="${user.isActive}">
                    ${user.isActive ? 'Khóa' : 'Mở khóa'}
                  </button>
                </td>
              </tr>
              <tr class="user-detail-row" id="detail-row-${idx}" style="display:none; background:#f8f9fa;">
                <td colspan="6" style="padding:12px 24px;">
                  ${address}
                  <div><b>Giới tính:</b> ${user.gender || 'Không rõ'}</div>
                  <div><b>Đã xác thực email:</b> ${user.is_verified ? 'Có' : 'Chưa'}</div>
                  <div><b>Quyền:</b> ${(user.roles || []).join(', ')}</div>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có dữ liệu</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Lỗi tải dữ liệu</td></tr>';
      }
    }
    fetchUsers();

    // Xử lý các nút thao tác
    document.getElementById('user-table-body').addEventListener('click', async function(e) {
      // Chi tiết
      if (e.target.classList.contains('btn-detail')) {
        const idx = e.target.getAttribute('data-idx');
        const detailRow = document.getElementById('detail-row-' + idx);
        if (detailRow.style.display === 'none') {
          detailRow.style.display = '';
          e.target.textContent = 'Ẩn chi tiết';
        } else {
          detailRow.style.display = 'none';
          e.target.textContent = 'Chi tiết';
        }
      }

      // Khóa/Mở khóa
      if (e.target.classList.contains('btn-lock-toggle')) {
        const id = e.target.getAttribute('data-id');
        const isActive = e.target.getAttribute('data-active') === 'true';
        if (confirm(`Bạn có chắc chắn muốn ${isActive ? 'khóa' : 'mở khóa'} người dùng này?`)) {
          try {
            const res = await fetch(`https://server-shelf-stacker.onrender.com/auth/users/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ isActive: !isActive })
            });
            if (res.ok) {
              alert(`${isActive ? 'Khóa' : 'Mở khóa'} người dùng thành công!`);
              fetchUsers();
            } else {
              const err = await res.json();
              alert('Thao tác thất bại: ' + (err.message || 'Lỗi không xác định!'));
            }
          } catch (err) {
            alert('Lỗi kết nối!');
          }
        }
      }

      // Sửa (popup đơn giản)
      if (e.target.classList.contains('btn-edit')) {
        const id = e.target.getAttribute('data-id');
        try {
          const res = await fetch(`https://server-shelf-stacker.onrender.com/auth/users/${id}`);
          if (res.ok) {
            const user = await res.json();
            const newName = prompt('Sửa họ tên:', user.full_name || user.username || '');
            if (newName !== null && newName.trim() !== '' && newName !== (user.full_name || user.username)) {
              const updateRes = await fetch(`https://server-shelf-stacker.onrender.com/auth/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: newName })
              });
              if (updateRes.ok) {
                alert('Cập nhật thành công!');
                fetchUsers();
              } else {
                const err = await updateRes.json();
                alert('Cập nhật thất bại: ' + (err.message || 'Lỗi không xác định!'));
              }
            }
          } else {
            alert('Không lấy được thông tin người dùng!');
          }
        } catch (err) {
          alert('Lỗi kết nối!');
        }
      }
    });
  </script>
</body>
</html>
