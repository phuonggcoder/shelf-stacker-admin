<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản Lý Danh Mục</title>
  <link rel="stylesheet" href="../public/assets/css/DanhMuc.css" />
</head>
<body>
  <header class="header">
    <div class="logo">SleekAdmin</div>
    <div class="user">
      <input type="text" placeholder="Enter keywords..." />
      <img src="https://i.pravatar.cc/40" alt="User" class="avatar" />
    </div>
  </header>

  <aside class="sidebar">
    <div class="profile">
      <img src="https://i.pravatar.cc/100" alt="User Profile" />
      <h3>Jonathan Clarke</h3>
      <p>UI/UX Designer</p>
    </div>
    <nav>
      <ul>
        <li><a href="home.html">TRANG CHỦ</a></li>
        <li><a href="quanlydanhmuc.html">QUẢN LÝ DANH MỤC</a></li>
        <li><a href="danhgiasanpham.html">DANH SÁCH TRUYỆN TRANH</a></li>
        <li><a href="quanlynguoidung.html">QUẢN LÝ NGƯỜI DÙNG</a></li>
        <li><a href="danhmucdonhang.html">QUẢN LÝ ĐƠN HÀNG</a></li>
        <li><a href="danhgia.html">ĐÁNH GIÁ</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main">
    <h2>Quản Lý Danh Mục</h2>
    <div class="search-filter">
      <input type="text" placeholder="Tìm kiếm danh mục..." />
      <select>
        <option>Sắp xếp A-Z</option>
        <option>Sắp xếp Z-A</option>
      </select>
      <button class="btn-export">+ Thêm danh mục</button>
    </div>
    <!-- Modal thêm danh mục -->
    <div id="add-category-modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:9999; align-items:center; justify-content:center;">
      <form id="add-category-form" style="background:#fff; padding:32px 24px; border-radius:8px; min-width:320px; max-width:90vw; margin:auto; display:flex; flex-direction:column; gap:14px; box-shadow:0 4px 24px rgba(0,0,0,0.15);">
        <h3 style="margin:0 0 10px 0;">Thêm danh mục mới</h3>
        <input type="text" id="cat-name" placeholder="Tên danh mục" required style="padding:10px; font-size:16px;">
        <input type="text" id="cat-image" placeholder="Link ảnh (tùy chọn)" style="padding:10px; font-size:16px;">
        <textarea id="cat-desc" placeholder="Mô tả" style="padding:10px; font-size:16px;"></textarea>
        <select id="cat-status" style="padding:10px; font-size:16px;">
          <option value="active">Hiển thị</option>
          <option value="inactive">Ẩn</option>
        </select>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="submit" style="flex:1; background:#007bff; color:#fff; border:none; border-radius:5px; padding:10px 0; font-size:16px;">Thêm</button>
          <button type="button" id="close-modal" style="flex:1; background:#ccc; color:#222; border:none; border-radius:5px; padding:10px 0; font-size:16px;">Hủy</button>
        </div>
      </form>
    </div>
    <table>
      <thead>
        <tr>
          <th>Ảnh</th>
          <th>Tên danh mục</th>
          <th>Mô tả</th>
          <th>Trạng thái</th>
          <th>Số truyện</th>
          <th class="actions">Thao tác</th>
        </tr>
      </thead>
      <tbody id="category-table-body">
        <tr>
          <td colspan="6" style="text-align:center;">Đang tải...</td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <button>&laquo;</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>&raquo;</button>
    </div>
  </main>
  <script>
    async function fetchCategories() {
      const tbody = document.getElementById('category-table-body');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Đang tải...</td></tr>';
      try {
        const res = await fetch('https://server-shelf-stacker.onrender.com/api/categories');
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          tbody.innerHTML = '';
          data.forEach(cat => {
            tbody.innerHTML += `
              <tr>
                <td><img src="${cat.image || '../img/default.jpg'}" alt="thumb" class="thumb" /></td>
                <td>${cat.name || ''}</td>
                <td>${cat.description || ''}</td>
                <td>${cat.status === 'active' || cat.status === true ? 'Hiển thị' : 'Ẩn'}</td>
                <td>${cat.totalBooks || 0}</td>
                <td class="actions">
                  <button class="action-btn btn-update">Sửa</button>
                  <button class="action-btn btn-return">Xóa</button>
                  <button class="action-btn btn-confirm">${cat.status === 'active' || cat.status === true ? 'Ẩn' : 'Hiển thị'}</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có dữ liệu</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Lỗi tải dữ liệu</td></tr>';
      }
    }
    fetchCategories();

    // Mở modal thêm danh mục
    document.querySelector('.btn-export').addEventListener('click', function() {
      document.getElementById('add-category-modal').style.display = 'flex';
    });
    // Đóng modal
    document.getElementById('close-modal').onclick = function() {
      document.getElementById('add-category-modal').style.display = 'none';
    };

    // Xử lý submit form thêm danh mục
    document.getElementById('add-category-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('cat-name').value.trim();
      const image = document.getElementById('cat-image').value.trim();
      const description = document.getElementById('cat-desc').value.trim();
      const status = document.getElementById('cat-status').value;
      if (!name) {
        alert('Vui lòng nhập tên danh mục!');
        return;
      }
      try {
        const res = await fetch('https://server-shelf-stacker.onrender.com/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, image, description, status })
        });
        if (res.ok) {
          alert('Thêm danh mục thành công!');
          document.getElementById('add-category-modal').style.display = 'none';
          fetchCategories();
          this.reset();
        } else {
          const err = await res.json();
          alert('Thêm thất bại: ' + (err.message || 'Lỗi không xác định!'));
        }
      } catch (err) {
        alert('Lỗi kết nối!');
      }
    });
  </script>
</body>
</html>
