<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản Lý Danh Mục</title>
  <link rel="stylesheet" href="/assets/css/DanhMuc.css" />
  <script src="https://cdn.ckeditor.com/ckeditor5/41.2.1/classic/ckeditor.js"></script>
  <style>
  /* ...existing styles... */
  .thumb {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .sidebar a.active {
  color: #007bff;
  font-weight: 600;
  background: #f0f8ff;
  border-left: 4px solid #007bff;
}
</style>
</head>
<body>
  <header class="header">
    <div class="logo">SleekAdmin</div>
    <div class="user">
      <input type="text" placeholder="Enter keywords..." />
      <img src="https://i.pravatar.cc/40" alt="User" class="avatar" />
    </div>
  </header>

  <aside class="sidebar" style="background: #0ea5e9; width: 250px; min-height: 100vh; box-shadow: 2px 0 8px rgba(0,0,0,0.04);">
    <div class="profile" style="text-align:center; padding: 32px 0 16px 0;">
      <img src="https://i.pravatar.cc/100" alt="User Profile" style="border-radius:50%; border:3px solid #fff; width:80px; height:80px;"/>
      <h3 style="margin: 12px 0 4px 0; color: #fff;">Tuấn Anh</h3>
      <p style="color: #e0eaff; font-size: 14px;">Nhà thiết kế UI/UX</p>
    </div>
    <nav>
      <ul style="list-style:none; padding:0; margin:0;">
        <li>
          <a href="home" style="display:block; padding:14px 32px; color:#fff; text-decoration:none; font-weight:500; border-left:4px solid transparent;">
            TRANG CHỦ
          </a>
        </li>
        <li>
          <a href="quanlydanhmuc" class="active" style="display:block; padding:14px 32px; color:#007bff; background:#fff; font-weight:600; border-left:4px solid #fff;">
            QUẢN LÝ DANH MỤC
          </a>
        </li>
        <li>
          <a href="danhgiasanpham" style="display:block; padding:14px 32px; color:#fff; text-decoration:none; font-weight:500; border-left:4px solid transparent;">
            DANH SÁCH TRUYỆN TRANH
          </a>
        </li>
        <li>
          <a href="quanlynguoidung" style="display:block; padding:14px 32px; color:#fff; text-decoration:none; font-weight:500; border-left:4px solid transparent;">
            QUẢN LÝ NGƯỜI DÙNG
          </a>
        </li>
        <li>
          <a href="danhmucdonhang" style="display:block; padding:14px 32px; color:#fff; text-decoration:none; font-weight:500; border-left:4px solid transparent;">
            QUẢN LÝ ĐƠN HÀNG
          </a>
        </li>
        <li>
          <a href="trashbooks" style="display:block; padding:14px 32px; color:#fff; text-decoration:none; font-weight:500; border-left:4px solid transparent;">
            ĐÃ XÓA GẦN ĐÂY
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main">
    <h2>Quản Lý Danh Mục</h2>
    <div class="search-filter" style="display: flex; gap: 6px; align-items: center; margin-bottom: 16px;">
      <input type="text" id="search-slug" placeholder="Tìm danh mục..." 
        style="padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; outline: none; flex: 1;" />
      <button id="btn-search" type="button"
        style="display: flex; align-items: center; gap: 6px; background: #007bff; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; font-size: 16px; cursor: pointer; transition: background 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#fff" stroke-width="2"/><path stroke="#fff" stroke-width="2" stroke-linecap="round" d="M20 20l-3-3"/></svg>
        Tìm kiếm
      </button>
      <select id="filter-status" style="padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Hiển thị</option>
        <option value="inactive">Ẩn</option>
      </select>
      <button class="btn-export">+ Thêm danh mục</button>
    </div> 
    <!-- Modal thêm/cập nhật danh mục -->
    <div id="add-category-modal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); z-index:9999; align-items:center; justify-content:center;">
      <form id="add-category-form" style="background:#fff; padding:32px 24px; border-radius:8px; min-width:320px; max-width:90vw; margin:auto; display:flex; flex-direction:column; gap:14px; box-shadow:0 4px 24px rgba(0,0,0,0.15);">
        <h3 style="margin:0 0 10px 0;">Thêm/Cập nhật danh mục</h3>
        <input type="text" id="cat-name" placeholder="Tên danh mục" required style="padding:10px; font-size:16px;">
        <input type="text" id="cat-slug" placeholder="Slug (không dấu, viết liền)" required style="padding:10px; font-size:16px;">
        <input type="text" id="cat-image" placeholder="Link ảnh (tùy chọn)" style="padding:10px; font-size:16px;">
        <textarea id="cat-desc" placeholder="Mô tả"></textarea>
        <select id="cat-status" style="padding:10px; font-size:16px;">
          <option value="true">Hiển thị</option>
          <option value="false">Ẩn</option>
        </select>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="submit" id="save-category-btn" style="flex:1; background:#007bff; color:#fff; border:none; border-radius:5px; padding:10px 0; font-size:16px;">Thêm</button>
          <button type="button" id="update-category-btn" style="flex:1; background:#28a745; color:#fff; border:none; border-radius:5px; padding:10px 0; font-size:16px; display:none;">Cập nhật</button>
          <button type="button" id="close-modal" style="flex:1; background:#ccc; color:#222; border:none; border-radius:5px; padding:10px 0; font-size:16px;">Hủy</button>
        </div>
      </form>
    </div>
    <table>
      <thead>
        <tr>
          <th>Ảnh</th>
          <th>Tên danh mục</th>
          <th>Mô tả</th>
          <th>Trạng thái</th>
          <th>Số truyện</th>
          <th class="actions">Thao tác</th>
        </tr>
      </thead>
      <tbody id="category-table-body">
        <tr>
          <td colspan="6" style="text-align:center;">Đang tải...</td>
        </tr>
      </tbody>
    </table>
    <!-- Thay đoạn div.pagination cũ bằng div rỗng để JS tự render phân trang đẹp -->
    <div class="pagination"></div>
  </main>
  
  <script>
    let editingCategoryId = null;

    let categories = [];
let catCurrentPage = 1;
const catPageSize = 6;

// Hàm render danh mục với phân trang
function renderCategoriesWithPagination(categoriesArr, page = 1) {
  const tbody = document.getElementById('category-table-body');
  const totalPages = Math.ceil(categoriesArr.length / catPageSize);
  if (page > totalPages && totalPages > 0) page = totalPages;
  if (page < 1) page = 1;
  catCurrentPage = page;

  // Lấy danh mục cho trang hiện tại
  const start = (page - 1) * catPageSize;
  const end = start + catPageSize;
  const pageCategories = categoriesArr.slice(start, end);

  tbody.innerHTML = '';
  if (pageCategories.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không có dữ liệu</td></tr>';
    return;
  }
  // Khi render bảng, dùng isVisible để hiển thị trạng thái
  pageCategories.forEach(cat => {
    tbody.innerHTML += `
      <tr>
        <td><img src="${cat.image || '../img/default.jpg'}" alt="thumb" class="thumb" /></td>
        <td>${cat.name || ''}</td>
        <td>${cat.description || ''}</td>
        <td>${cat.isVisible === false ? 'Ẩn' : 'Hiển thị'}</td>
        <td>${cat.totalBooks || 0}</td>
        <td class="actions">
          <button class="action-btn btn-update"
            data-id="${cat._id}"
            data-name="${cat.name || ''}"
            data-slug="${cat.slug || ''}"
            data-image="${cat.image || ''}"
            data-description="${cat.description || ''}"
            data-status="${cat.isVisible === false ? 'false' : 'true'}"
          >Sửa</button>
          <button class="action-btn btn-return" data-id="${cat._id}">Xóa</button>
          <button class="action-btn btn-confirm">${cat.isVisible === false ? 'Hiển thị' : 'Ẩn'}</button>
        </td>
      </tr>
    `;
  });

  // Render nút phân trang với hình ảnh SVG đẹp
  const paginationDiv = document.querySelector('.pagination');
  paginationDiv.innerHTML = '';
  if (totalPages > 1) {
    // Nút trang trước với icon
    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    prevBtn.className = 'pagination-btn';
    prevBtn.disabled = page === 1;
    prevBtn.style.background = "#fff";
    prevBtn.style.border = "1px solid #007bff";
    prevBtn.style.borderRadius = "50%";
    prevBtn.style.width = "40px";
    prevBtn.style.height = "40px";
    prevBtn.style.display = "flex";
    prevBtn.style.alignItems = "center";
    prevBtn.style.justifyContent = "center";
    prevBtn.style.margin = "0 6px";
    prevBtn.onclick = () => renderCategoriesWithPagination(categoriesArr, page - 1);

    // Nút trang sau với icon
    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    nextBtn.className = 'pagination-btn';
    nextBtn.disabled = page === totalPages;
    nextBtn.style.background = "#fff";
    nextBtn.style.border = "1px solid #007bff";
    nextBtn.style.borderRadius = "50%";
    nextBtn.style.width = "40px";
    nextBtn.style.height = "40px";
    nextBtn.style.display = "flex";
    nextBtn.style.alignItems = "center";
    nextBtn.style.justifyContent = "center";
    nextBtn.style.margin = "0 6px";
    nextBtn.onclick = () => renderCategoriesWithPagination(categoriesArr, page + 1);

    // Hiển thị số trang
    const pageInfo = document.createElement('span');
    pageInfo.textContent = `Trang ${page} / ${totalPages}`;
    pageInfo.style = 'padding: 0 10px; font-weight:bold; font-size:16px; color:#007bff; display:flex; align-items:center;';

    paginationDiv.appendChild(prevBtn);
    paginationDiv.appendChild(pageInfo);
    paginationDiv.appendChild(nextBtn);
  }
}

// Sửa lại fetchCategories để lưu categories và gọi renderCategoriesWithPagination
async function fetchCategories() {
  const tbody = document.getElementById('category-table-body');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Đang tải...</td></tr>';
  try {
    const res = await fetch('https://server-shelf-stacker.onrender.com/api/categories');
    const data = await res.json();
    categories = Array.isArray(data) ? data : [];
    renderCategoriesWithPagination(categories, 1);
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Lỗi tải dữ liệu</td></tr>';
  }
}
fetchCategories();

    // Thêm chức năng ẨN/HIỂN THỊ cho nút btn-confirm
document.addEventListener('click', async function(e) {
  // Xóa
  if (e.target.classList.contains('btn-return')) {
    const id = e.target.getAttribute('data-id');
    if (confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
      try {
        const res = await fetch(`https://server-shelf-stacker.onrender.com/api/categories/${id}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('Xóa danh mục thành công!');
          fetchCategories();
        } else {
          const err = await res.json();
          alert('Xóa thất bại: ' + (err.message || 'Lỗi không xác định!'));
        }
      } catch (err) {
        alert('Lỗi kết nối!');
      }
    }
  }
  // Sửa
  if (e.target.classList.contains('btn-update')) {
    editingCategoryId = e.target.getAttribute('data-id');
    document.getElementById('cat-name').value = e.target.getAttribute('data-name') || '';
    document.getElementById('cat-slug').value = e.target.getAttribute('data-slug') || '';
    document.getElementById('cat-image').value = e.target.getAttribute('data-image') || '';
    setTimeout(() => {
      initCatDescEditorIfNeeded().then(() => {
        if (catDescEditor) catDescEditor.setData(e.target.getAttribute('data-description') || '');
      });
    }, 0);
    document.getElementById('cat-status').value = e.target.getAttribute('data-status') === 'false' ? 'false' : 'true';
    document.getElementById('add-category-modal').style.display = 'flex';
    document.getElementById('save-category-btn').style.display = 'none';
    document.getElementById('update-category-btn').style.display = 'block';
  }

  // Ẩn/Hiển thị
  if (e.target.classList.contains('btn-confirm')) {
    const row = e.target.closest('tr');
    const id = row.querySelector('.btn-update').getAttribute('data-id');
    // Lấy trạng thái hiện tại
    const currentVisible = e.target.textContent.trim() === 'Ẩn' ? true : false;
    const newVisible = !currentVisible;
    if (!id) return;
    try {
      const res = await fetch(`https://server-shelf-stacker.onrender.com/api/categories/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isVisible: newVisible })
      });
      if (res.ok) {
        alert(newVisible ? 'Đã hiển thị danh mục!' : 'Đã ẩn danh mục!');
        fetchCategories();
      } else {
        const err = await res.json();
        alert('Cập nhật trạng thái thất bại: ' + (err.message || 'Lỗi không xác định!'));
      }
    } catch (err) {
      alert('Lỗi kết nối!');
    }
  }
});

    // Hàm lọc danh mục theo từ khóa và trạng thái (dùng isVisible)
function filterCategories(categories, keyword, status) {
  const lower = keyword.toLowerCase();
  return categories.filter(c =>
    ((c.name || '').toLowerCase().includes(lower) ||
     (c.slug || '').toLowerCase().includes(lower) ||
     (c.description || '').toLowerCase().includes(lower))
    && (
      status === '' ||
      (status === 'active' && c.isVisible !== false) ||
      (status === 'inactive' && c.isVisible === false)
    )
  );
}

// Nút tìm kiếm
document.getElementById('btn-search').addEventListener('click', function() {
  const keyword = document.getElementById('search-slug').value.trim();
  const status = document.getElementById('filter-status').value;
  const filtered = filterCategories(categories, keyword, status);
  renderCategoriesWithPagination(filtered, 1);
});

// Lọc realtime khi gõ vào ô tìm kiếm hoặc đổi trạng thái
document.getElementById('search-slug').addEventListener('input', function() {
  const keyword = this.value;
  const status = document.getElementById('filter-status').value;
  const filtered = filterCategories(categories, keyword, status);
  renderCategoriesWithPagination(filtered, 1);
});
document.getElementById('filter-status').addEventListener('change', function() {
  const keyword = document.getElementById('search-slug').value.trim();
  const status = this.value;
  const filtered = filterCategories(categories, keyword, status);
  renderCategoriesWithPagination(filtered, 1);
});

    // Mở modal thêm danh mục
    document.querySelector('.btn-export').addEventListener('click', function() {
      document.getElementById('add-category-modal').style.display = 'flex';
      document.getElementById('save-category-btn').style.display = 'block';
      document.getElementById('update-category-btn').style.display = 'none';
      editingCategoryId = null;
      document.getElementById('add-category-form').reset();
      setTimeout(() => {
        initCatDescEditorIfNeeded().then(() => {
          if (catDescEditor) catDescEditor.setData('');
        });
      }, 0);
    });

    // Đóng modal
    document.getElementById('close-modal').onclick = function() {
      document.getElementById('add-category-modal').style.display = 'none';
      document.getElementById('save-category-btn').style.display = 'block';
      document.getElementById('update-category-btn').style.display = 'none';
      editingCategoryId = null;
      document.getElementById('add-category-form').reset();
    };

    // Thêm danh mục mới
    document.getElementById('add-category-form').addEventListener('submit', async function(e) {
      if (editingCategoryId) return; // Nếu đang sửa thì không cho thêm mới
      e.preventDefault();
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim();
      const image = document.getElementById('cat-image').value.trim();
      await initCatDescEditorIfNeeded();
      const description = catDescEditor ? catDescEditor.getData() : document.getElementById('cat-desc').value.trim();
      const isVisible = document.getElementById('cat-status').value === 'true';
      if (!name || !slug) {
        alert('Vui lòng nhập tên danh mục và slug!');
        return;
      }
      try {
        const res = await fetch('https://server-shelf-stacker.onrender.com/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, description, image, isVisible })
        });
        if (res.ok) {
          alert('Thêm danh mục thành công!');
          document.getElementById('add-category-modal').style.display = 'none';
          fetchCategories();
          this.reset();
        } else {
          const err = await res.json();
          alert('Thêm thất bại: ' + (err.message || 'Lỗi không xác định!'));
        }
      } catch (err) {
        alert('Lỗi kết nối!');
      }
    });

    // Xử lý xóa và sửa danh mục
    document.addEventListener('click', async function(e) {
      // Xóa
      if (e.target.classList.contains('btn-return')) {
        const id = e.target.getAttribute('data-id');
        if (confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
          try {
            const res = await fetch(`https://server-shelf-stacker.onrender.com/api/categories/${id}`, {
              method: 'DELETE'
            });
            if (res.ok) {
              alert('Xóa danh mục thành công!');
              fetchCategories();
            } else {
              const err = await res.json();
              alert('Xóa thất bại: ' + (err.message || 'Lỗi không xác định!'));
            }
          } catch (err) {
            alert('Lỗi kết nối!');
          }
        }
      }
      // Sửa
      if (e.target.classList.contains('btn-update')) {
        editingCategoryId = e.target.getAttribute('data-id');
        document.getElementById('cat-name').value = e.target.getAttribute('data-name') || '';
        document.getElementById('cat-slug').value = e.target.getAttribute('data-slug') || '';
        document.getElementById('cat-image').value = e.target.getAttribute('data-image') || '';
        setTimeout(() => {
          initCatDescEditorIfNeeded().then(() => {
            if (catDescEditor) catDescEditor.setData(e.target.getAttribute('data-description') || '');
          });
        }, 0);
        document.getElementById('cat-status').value = e.target.getAttribute('data-status') === 'false' ? 'false' : 'true';
        document.getElementById('add-category-modal').style.display = 'flex';
        document.getElementById('save-category-btn').style.display = 'none';
        document.getElementById('update-category-btn').style.display = 'block';
      }
    });

    // Cập nhật danh mục
    document.getElementById('update-category-btn').addEventListener('click', async function(e) {
      e.preventDefault();
      if (!editingCategoryId) return;
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim();
      const image = document.getElementById('cat-image').value.trim();
      await initCatDescEditorIfNeeded();
      const description = catDescEditor ? catDescEditor.getData() : document.getElementById('cat-desc').value.trim();
      const isVisible = document.getElementById('cat-status').value === 'true';
      if (!name || !slug) {
        alert('Vui lòng nhập tên danh mục và slug!');
        return;
      }
      try {
        const res = await fetch(`https://server-shelf-stacker.onrender.com/api/categories/${editingCategoryId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, description, image, isVisible })
        });
        if (res.ok) {
          alert('Cập nhật danh mục thành công!');
          document.getElementById('add-category-modal').style.display = 'none';
          fetchCategories();
          document.getElementById('add-category-form').reset();
          document.getElementById('save-category-btn').style.display = 'block';
          document.getElementById('update-category-btn').style.display = 'none';
          editingCategoryId = null;
        } else {
          const err = await res.json();
          alert('Cập nhật thất bại: ' + (err.message || 'Lỗi không xác định!'));
        }
      } catch (err) {
        alert('Lỗi kết nối!');
      }
    });

    // Khởi tạo CKEditor 5 cho mô tả danh mục
let catDescEditor = null;
let catDescEditorPromise = null;
function initCatDescEditorIfNeeded() {
  if (!catDescEditorPromise) {
    catDescEditorPromise = ClassicEditor.create(document.querySelector('#cat-desc'))
      .then(editor => {
        catDescEditor = editor;
        return editor;
      })
      .catch(error => {
        console.error(error);
      });
  }
  return catDescEditorPromise;
}
initCatDescEditorIfNeeded();
  </script>
</body>
</html>
