<!-- dialog-popup.html -->
<div id="successDialog" class="custom-dialog">
  <div class="dialog-content">
    <div class="dialog-icon">✔️</div>
    <div class="dialog-message" id="successMessage">Thành công!</div>
    <button class="dialog-btn" onclick="hideSuccessDialog()">OK</button>
  </div>
</div>

<style>
  .custom-dialog {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
  }
  .custom-dialog.active {
    display: flex;
  }
  .dialog-content {
    background: #fff;
    padding: 20px 24px;
    border-radius: 10px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }
  .dialog-icon {
    font-size: 28px;
    color: #00e0ff;
    margin-bottom: 10px;
  }
  .dialog-message {
    font-size: 16px;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .dialog-btn {
    background-color: #00e0ff;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 20px;
    font-weight: bold;
    cursor: pointer;
  }
</style>

<script src="/assets/js/loading-state-helper.js"></script>
    <script>
  window.showSuccessDialog = function(message = 'Thành công!') {
    const dialog = document.getElementById('successDialog');
    const msg = document.getElementById('successMessage');
    msg.textContent = message;
    dialog.classList.add('active');
  }

  window.hideSuccessDialog = function() {
    document.getElementById('successDialog').classList.remove('active');
  }
</script>
