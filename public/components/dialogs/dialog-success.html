<!-- Dialog thành công -->
<div id="dialog-success" style="
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
">
  <div style="
    background: #fff;
    padding: 32px 40px;
    border-radius: 16px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    animation: fadeIn 0.3s ease;
  ">
    <div style="margin-bottom: 20px;">
      <img src="https://img.icons8.com/fluency/48/000000/checked.png" alt="success icon" />
    </div>
    <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #333;">Thêm sách thành công!</h3>
    <div style="display: flex; justify-content: center; gap: 12px;">
      <button onclick="closeSuccessDialog()" style="
        flex: 1;
        padding: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: white;
        color: #333;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
      " onmouseover="this.style.background='#f2f2f2'" onmouseout="this.style.background='white'">Quay lại</button>
      <button onclick="closeSuccessDialog()" style="
        flex: 1;
        padding: 10px 0;
        border: none;
        border-radius: 8px;
        background: #00cfff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      " onmouseover="this.style.background='#00b8e6'" onmouseout="this.style.background='#00cfff'">Xác nhận</button>
    </div>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
