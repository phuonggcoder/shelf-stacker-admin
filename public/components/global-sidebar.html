<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <img src="/assets/images/logo.png" alt="Admin Logo">
            <span>Admin Panel</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <ul>
            <li>
                <a href="/home" class="nav-link" data-page="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Trang chủ</span>
                </a>
            </li>
            <li>
                <a href="/admin/books" class="nav-link" data-page="books">
                    <i class="fas fa-book"></i>
                    <span>Quản lý sách</span>
                </a>
            </li>
            <li>
                <a href="/admin/orders" class="nav-link" data-page="orders">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Quản lý đơn hàng</span>
                </a>
            </li>
            <li>
                <a href="/admin/users" class="nav-link" data-page="users">
                    <i class="fas fa-users"></i>
                    <span>Quản lý người dùng</span>
                </a>
            </li>
            <li>
                <a href="/admin/categories" class="nav-link" data-page="categories">
                    <i class="fas fa-tags"></i>

                </a>
            </li>
            <li>
                <a href="/admin/vouchers" class="nav-link" data-page="vouchers">
                    <i class="fas fa-ticket-alt"></i>

                </a>
            </li>
            <li>

                    <i class="fas fa-bell"></i>
                    <span>Thông báo</span>
                </a>
            </li>
            <li>
                <a href="/admin/reports" class="nav-link" data-page="reports">
                    <i class="fas fa-chart-line"></i>
                    <span>Thống kê & Báo cáo</span>
                </a>
            </li>
            <li>
                <a href="/admin/settings" class="nav-link" data-page="settings">
                    <i class="fas fa-cog"></i>

            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <img src="/assets/images/default-avatar.png" alt="User Avatar" id="userAvatar">
            <div class="user-details">
                <span id="userName">Admin</span>
                <small id="userRole">Administrator</small>
            </div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Đăng xuất</span>
        </button>
    </div>
</aside>

<style>
/* Sidebar Styles */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 260px;
    height: 100vh;
    background: #1e293b;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: all 0.3s ease;
}

.sidebar-header {
    padding: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(248, 250, 252, 0.1);
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.logo img {
    width: 32px;
    height: 32px;
}

.logo span {
    font-size: 1.25rem;
    font-weight: 600;
}

.sidebar-toggle {
    display: none;
    background: none;
    border: none;
    color: #f8fafc;
    font-size: 1.25rem;
    cursor: pointer;
}

.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0;
}

.sidebar-nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.nav-link {
    display: flex;
    align-items: center;
    padding: 0.75rem 1.25rem;
    color: #cbd5e1;
    text-decoration: none;
    gap: 0.75rem;
    transition: all 0.2s ease;
}

.nav-link i {
    width: 20px;
    text-align: center;
}

.nav-link:hover,
.nav-link.active {
    background: rgba(248, 250, 252, 0.1);
    color: #f8fafc;
}

.sidebar-footer {
    padding: 1rem;
    border-top: 1px solid rgba(248, 250, 252, 0.1);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

#userAvatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(248, 250, 252, 0.2);
}

.user-details {
    display: flex;
    flex-direction: column;
}

#userName {
    font-weight: 500;
}

#userRole {
    color: #cbd5e1;
    font-size: 0.875rem;
}

.logout-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem;
    background: #dc2626;
    color: #f8fafc;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: background 0.2s ease;
}

.logout-btn:hover {
    background: #b91c1c;
}

/* Responsive Styles */
@media (max-width: 1024px) {
    .sidebar {
        transform: translateX(-100%);
    }

    .sidebar.active {
        transform: translateX(0);
    }

    .sidebar-toggle {
        display: block;
    }

    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
    }
}
</style>

<script>
// Handle Sidebar Toggle
document.getElementById('sidebarToggle')?.addEventListener('click', function() {
    document.querySelector('.sidebar').classList.toggle('active');
});

// Handle Active Link
function setActiveLink() {
    const currentPath = window.location.pathname;
    const links = document.querySelectorAll('.nav-link');
    
    links.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });
}

// Handle Logout
async function handleLogout() {
    if (confirm('Bạn có chắc muốn đăng xuất?')) {
        window.apiClient.clearToken();
        window.location.href = '/login';
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    setActiveLink();
    
    // Load user info if available
    const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
    if (userData.name) {
        document.getElementById('userName').textContent = userData.name;
    }
    if (userData.role) {
        document.getElementById('userRole').textContent = userData.role;
    }
    if (userData.avatar) {
        document.getElementById('userAvatar').src = userData.avatar;
    }
});
</script>
