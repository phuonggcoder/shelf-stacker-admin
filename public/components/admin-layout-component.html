<!-- Admin Layout Component - Include this in all admin pages -->
<aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-book"></i>
            <span class="logo-text">Shelf Stacker</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/home" class="nav-link" data-page="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item has-submenu">
                <a href="#" class="nav-link">
                    <i class="fas fa-box"></i>
                    <span>Sản phẩm</span>
                    <i class="fas fa-chevron-down submenu-icon"></i>
                </a>
                <ul class="submenu">
                    <li><a href="/products" data-page="products">Danh sách sản phẩm</a></li>
                    <li><a href="/categories" data-page="categories">Danh mục</a></li>
                </ul>
            </li>
            <li class="nav-item">
                <a href="/orders" class="nav-link" data-page="orders">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Đơn hàng</span>
                    <span class="badge" id="ordersBadge">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/vouchers" class="nav-link" data-page="vouchers">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Vouchers</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/users" class="nav-link" data-page="users">
                    <i class="fas fa-users"></i>
                    <span>Người dùng</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/notifications" class="nav-link" data-page="notifications">
                    <i class="fas fa-bell"></i>
                    <span>Thông báo</span>
                    <span class="badge" id="notificationsBadge">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/reports" class="nav-link" data-page="reports">
                    <i class="fas fa-chart-bar"></i>
                    <span>Báo cáo</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/settings" class="nav-link" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Cài đặt</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-details">
                <span class="user-name" id="userName">Admin</span>
                <span class="user-email" id="userEmail">admin@email.com</span>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Đăng xuất</span>
        </button>
    </div>
</aside>

<main class="admin-main" id="adminMain">
    <header class="admin-header">
        <div class="header-left">
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="breadcrumb" id="breadcrumb">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </div>
        </div>
        <div class="header-right">
            <div class="header-actions">
                <button class="action-btn" id="notificationsBtn" title="Thông báo">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="headerNotificationsBadge">0</span>
                </button>
                <button class="action-btn" id="searchBtn" title="Tìm kiếm">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="user-menu">
                <div class="user-avatar-small" id="userAvatarSmall">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-menu-dropdown" id="userMenuDropdown">
                    <a href="/settings" class="dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>Cài đặt</span>
                    </a>
                    <a href="#" class="dropdown-item" id="logoutMenuItem">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Đăng xuất</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="page-content" id="pageContent">
        <!-- Page content will be inserted here -->
    </div>
</main>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p>Đang tải...</p>
</div>

<div class="toast-container" id="toastContainer"></div>
